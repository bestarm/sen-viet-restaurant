services:
  postgres:
    image: postgres:16-alpine
    container_name: senviet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-senviet_db}
      POSTGRES_USER: ${DB_USER:-senviet_user}
      POSTGRES_PASSWORD: ${DB_PASS:-senviet_secret_pass_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-senviet_user} -d ${DB_NAME:-senviet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - senviet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senviet-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-senviet_db}
      DB_USER: ${DB_USER:-senviet_user}
      DB_PASS: ${DB_PASS:-senviet_secret_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ZALO_WEBHOOK_URL: ${ZALO_WEBHOOK_URL:-https://openapi.zalo.me/v2.0/oa/message}
      ZALO_ALERT_ENABLED: ${ZALO_ALERT_ENABLED:-false}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - senviet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: senviet-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - senviet-network

volumes:
  postgres_data:
    driver: local

networks:
  senviet-network:
    driver: bridge
